<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Fondo Principal Dark Slate -->
  <rect width="1200" height="680" rx="14" fill="#020617" />
  <rect x="1" y="1" width="1198" height="678" rx="13" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Encabezado de Sección -->
  <text x="44" y="48" fill="#fb7185" font-size="12" font-weight="600" class="sans">02. Huellas Digitales Criptográficas y Efecto Avalancha</text>
  <text x="44" y="80" fill="#ffffff" font-size="26" font-weight="700" class="sans">Visualizador y Comparador Gráfico de Hashes (SHA-256)</text>
  <text x="44" y="106" fill="#94a3b8" font-size="13" class="sans">Un resumen SHA-256 de 32 bytes se representa mediante 32 emoticonos únicos, permitiendo detectar alteraciones de 1 solo bit al instante.</text>

  <!-- Selector de Algoritmo -->
  <rect x="880" y="54" width="276" height="36" rx="8" fill="#0f172a" stroke="#1e293b" />
  <rect x="884" y="58" width="76" height="28" rx="6" fill="#1e293b" />
  <text x="922" y="76" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600" class="mono">SHA-256</text>
  <text x="996" y="76" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">SHA-512</text>
  <text x="1062" y="76" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">SHA-384</text>
  <text x="1122" y="76" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">SHA-1</text>

  <!-- Panel A (Original) -->
  <rect x="44" y="132" width="542" height="390" rx="12" fill="#0f172a" stroke="#1e293b" />
  <text x="66" y="164" fill="#ffffff" font-size="14" font-weight="600" class="sans">Mensaje o Referencia A (Original)</text>
  <text x="564" y="164" text-anchor="end" fill="#64748b" font-size="11" class="mono">52 bytes · 256 bits hash</text>

  <rect x="66" y="180" width="498" height="54" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="82" y="212" fill="#f8fafc" font-size="13" class="mono">Transferir 1000 EUR a la cuenta ES91-2100-0418-4502</text>

  <text x="66" y="262" fill="#94a3b8" font-size="12" font-weight="500" class="sans">Huella Visual Base256 (32 emoticonos · Diccionario Expresivo)</text>
  <rect x="66" y="274" width="498" height="106" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="82" y="316" font-size="23">🦊 🚀 🍀 🌊 ⛺ 🔥 🎯 💎 🧬 📡 🔮 🧿 🍕 🍔 🍿 🎀</text>
  <text x="82" y="358" font-size="23">🎃 🎄 🎈 🎓 🚁 🚂 ⛵ 🤔 🤯 🤠 🥳 🥰 🥵 🥶 👀 👑</text>

  <text x="66" y="408" fill="#94a3b8" font-size="12" class="sans">Digest Hexadecimal (64 nibbles)</text>
  <rect x="66" y="420" width="498" height="80" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="82" y="452" fill="#f43f5e" font-size="13" font-weight="600" class="mono">8f 3a c4 19 7b e2 08 d5 41 90 6c b3 2e 77 a9 14</text>
  <text x="82" y="480" fill="#f43f5e" font-size="13" font-weight="600" class="mono">5d 02 f8 63 c1 88 3b 4e 9a d0 17 55 e6 29 7c b1</text>

  <!-- Panel B (Comparación con 1 carácter alterado) -->
  <rect x="614" y="132" width="542" height="390" rx="12" fill="#0f172a" stroke="#1e293b" />
  <text x="636" y="164" fill="#ffffff" font-size="14" font-weight="600" class="sans">Mensaje o Referencia B (1 Carácter Modificado)</text>
  <text x="1134" y="164" text-anchor="end" fill="#64748b" font-size="11" class="mono">52 bytes · 256 bits hash</text>

  <rect x="636" y="180" width="498" height="54" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="652" y="212" fill="#f8fafc" font-size="13" class="mono">Transferir 1000 EUR a la cuenta ES91-2100-0418-4503</text>

  <text x="636" y="262" fill="#94a3b8" font-size="12" font-weight="500" class="sans">Huella Visual Base256 (32 emoticonos · 100% Mutados)</text>
  <rect x="636" y="274" width="498" height="106" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="652" y="316" font-size="23">🦁 🌵 🍄 🌙 🌟 🍎 🍉 🍒 🎸 🎺 🎻 🎲 🎳 🎮 🎰 🎱</text>
  <text x="652" y="358" font-size="23">🏆 🏇 🏈 🏊 🏠 🏭 🏮 🏰 🐉 🐋 🐍 🐎 🐑 🐒 🐓 🐧</text>

  <text x="636" y="408" fill="#94a3b8" font-size="12" class="sans">Digest Hexadecimal (64 nibbles)</text>
  <rect x="636" y="420" width="498" height="80" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="652" y="452" fill="#f43f5e" font-size="13" font-weight="600" class="mono">2c 91 e7 54 0a b8 63 1f d9 42 85 c0 76 3e 11 a4</text>
  <text x="652" y="480" fill="#f43f5e" font-size="13" font-weight="600" class="mono">b7 68 09 d2 35 f1 8c 20 64 e9 5b 18 73 a0 c6 4f</text>

  <!-- Barra Inferior de Diagnóstico de Hamming y Efecto Avalancha -->
  <rect x="44" y="542" width="1112" height="104" rx="12" fill="#0f172a" stroke="#1e293b" />
  <circle cx="82" cy="594" r="18" fill="#4c0519" stroke="#f43f5e" />
  <text x="82" y="600" text-anchor="middle" fill="#fb7185" font-size="18" font-weight="700" class="sans">!</text>
  <text x="114" y="584" fill="#ffffff" font-size="15" font-weight="700" class="sans">▼ DIVERGENCIA DETECTADA — EFECTO AVALANCHA ACTIVO</text>
  <text x="114" y="608" fill="#94a3b8" font-size="12" class="sans">De 32 bytes totales, los 32 emoticonos han cambiado por completo tras alterar un único carácter ('2' → '3').</text>

  <line x1="650" y1="560" x2="650" y2="628" stroke="#1e293b" />
  <text x="674" y="580" fill="#94a3b8" font-size="12" class="sans">Distancia de Hamming (Bits)</text>
  <text x="674" y="610" fill="#ffffff" font-size="20" font-weight="700" class="mono">131 / 256 bits (51.2%)</text>

  <line x1="930" y1="560" x2="930" y2="628" stroke="#1e293b" />
  <text x="954" y="580" fill="#94a3b8" font-size="12" class="sans">Emoticonos Alterados</text>
  <text x="954" y="610" fill="#fb7185" font-size="20" font-weight="700" class="mono">32 / 32 iconos</text>
</svg>
