<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <style>
      .sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; }
    </style>
  </defs>

  <!-- Fondo Principal Dark Slate -->
  <rect width="1200" height="760" rx="14" fill="#020617" />
  <rect x="1" y="1" width="1198" height="758" rx="13" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Barra de Ventana / Navegador -->
  <rect x="2" y="2" width="1196" height="44" rx="12" fill="#0f172a" />
  <line x1="2" y1="46" x2="1198" y2="46" stroke="#1e293b" stroke-width="1" />
  <circle cx="24" cy="24" r="6" fill="#f43f5e" />
  <circle cx="44" cy="24" r="6" fill="#f59e0b" />
  <circle cx="64" cy="24" r="6" fill="#10b981" />
  <rect x="380" y="11" width="440" height="26" rx="6" fill="#020617" stroke="#1e293b" />
  <text x="600" y="28" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono">https://unfantasmaenelsistema.github.io/emojibyte/</text>

  <!-- Top Bar App -->
  <rect x="2" y="47" width="1196" height="54" fill="#020617" />
  <line x1="2" y1="101" x2="1198" y2="101" stroke="#1e293b" stroke-width="1" />
  <text x="40" y="80" fill="#ffffff" font-size="18" font-weight="700" class="sans">EmojiByte Base256</text>
  <text x="430" y="79" fill="#f8fafc" font-size="13" font-weight="600" class="sans">Codificador</text>
  <text x="535" y="79" fill="#94a3b8" font-size="13" font-weight="500" class="sans">Hashes Visuales</text>
  <text x="665" y="79" fill="#94a3b8" font-size="13" font-weight="500" class="sans">Mapa Base256</text>
  <text x="785" y="79" fill="#94a3b8" font-size="13" font-weight="500" class="sans">Documentación</text>
  <rect x="965" y="60" width="195" height="30" rx="8" fill="#e11d48" />
  <text x="1062" y="79" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600" class="sans">Un Fantasma en el Sistema ↗</text>

  <!-- Barra de Control del Codificador -->
  <rect x="40" y="122" width="1120" height="56" rx="12" fill="#0f172a" stroke="#1e293b" />
  <rect x="54" y="132" width="185" height="36" rx="8" fill="#e11d48" />
  <text x="146" y="154" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600" class="sans">Codificar (Bytes → Emojis)</text>
  <rect x="245" y="132" width="185" height="36" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="337" y="154" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600" class="sans">Decodificar (Emojis → Bytes)</text>

  <text x="515" y="154" fill="#94a3b8" font-size="12" class="sans">Alfabeto:</text>
  <rect x="572" y="134" width="215" height="32" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="586" y="154" fill="#f1f5f9" font-size="12" font-weight="500" class="sans">Base256 Expresivo (Caras)</text>

  <rect x="800" y="134" width="170" height="32" rx="8" fill="#020617" stroke="#1e293b" />
  <rect x="812" y="143" width="14" height="14" rx="3" fill="#e11d48" />
  <text x="816" y="154" fill="#ffffff" font-size="11" font-weight="700" class="sans">✓</text>
  <text x="834" y="154" fill="#f1f5f9" font-size="12" font-weight="500" class="sans">Checksum CRC-8</text>

  <rect x="982" y="134" width="164" height="32" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="998" y="154" fill="#64748b" font-size="12" class="sans">🔒 Clave XOR activa</text>

  <!-- Panel Izquierdo: Entrada -->
  <rect x="40" y="196" width="548" height="290" rx="12" fill="#0f172a" stroke="#1e293b" />
  <text x="62" y="228" fill="#ffffff" font-size="14" font-weight="600" class="sans">Entrada de Datos (Origen)</text>
  <rect x="342" y="210" width="224" height="28" rx="7" fill="#020617" stroke="#1e293b" />
  <rect x="345" y="213" width="84" height="22" rx="5" fill="#1e293b" />
  <text x="387" y="228" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" class="sans">Texto / ASCII</text>
  <text x="466" y="228" text-anchor="middle" fill="#94a3b8" font-size="11" class="sans">Hex</text>
  <text x="526" y="228" text-anchor="middle" fill="#94a3b8" font-size="11" class="sans">Binario</text>

  <rect x="62" y="248" width="504" height="176" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="80" y="280" fill="#f8fafc" font-size="14" class="sans">Un Fantasma en el Sistema: Operación Silenciosa</text>
  <text x="80" y="304" fill="#f8fafc" font-size="14" class="sans">Coordenadas de enlace: 40°25′00″N 03°42′12″O</text>
  <text x="80" y="336" fill="#64748b" font-size="12" class="mono">// Buffer Uint8Array codificado en UTF-8 sin pérdida</text>

  <line x1="62" y1="440" x2="566" y2="440" stroke="#1e293b" />
  <text x="62" y="464" fill="#94a3b8" font-size="12" class="mono">Tamaño: 48 bytes · 384 bits · Entropía: 4.38 bits/B</text>
  <text x="440" y="464" fill="#f43f5e" font-size="12" class="mono">⇄ 16 Bytes Aleatorios</text>

  <!-- Panel Derecho: Salida Base256 -->
  <rect x="612" y="196" width="548" height="290" rx="12" fill="#0f172a" stroke="#1e293b" />
  <text x="634" y="228" fill="#ffffff" font-size="14" font-weight="600" class="sans">Salida Codificada en Emojis (Base256)</text>
  <rect x="940" y="210" width="198" height="28" rx="7" fill="#020617" stroke="#1e293b" />
  <text x="1039" y="228" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="500" class="sans">💬 Secuencia Pura (Directo)</text>

  <rect x="634" y="248" width="504" height="176" rx="8" fill="#020617" stroke="#1e293b" />
  <text x="654" y="292" font-size="24">😵🤞😀😆🥵🤞🤠🥵🙊🙇🥵😀😤🤞😀😤🙈</text>
  <text x="654" y="334" font-size="24">😀🙊🙇🙊🤠🥵😱🙇🥵🙊😀🗿🥰🥵😱🥵</text>
  <text x="654" y="376" font-size="24">🤠🤞🙇🙇🤞🥵😀🙇🙇🙊🤠🥵🍒🍕🚀🍀🛡️</text>

  <line x1="634" y1="440" x2="1138" y2="440" stroke="#1e293b" />
  <text x="634" y="464" fill="#94a3b8" font-size="12" class="mono">49 emoticonos · </text>
  <text x="742" y="464" fill="#10b981" font-size="12" font-weight="600" class="mono">CRC-8: 0x9C</text>
  <text x="832" y="464" fill="#94a3b8" font-size="12" class="mono">· Peso X/Twitter: 98/280</text>
  <rect x="1024" y="448" width="114" height="26" rx="6" fill="#e11d48" />
  <text x="1081" y="465" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600" class="sans">Copiar Salida</text>

  <!-- Inspector Educativo Inferior -->
  <rect x="40" y="504" width="1120" height="224" rx="12" fill="#0f172a" stroke="#1e293b" />
  <text x="62" y="534" fill="#ffffff" font-size="14" font-weight="600" class="sans">01. Inspector Educativo de Trazabilidad Byte ↔ Punto de Código Unicode</text>
  <text x="62" y="554" fill="#94a3b8" font-size="12" class="sans">Desglose en tiempo real de cada octeto en el buffer: Carácter ASCII → Binario (8 bits) → Índice Hex/Decimal → Emoticono Base256.</text>
  <text x="1138" y="540" text-anchor="end" fill="#64748b" font-size="12" class="mono">Mostrando 8 de 49 octetos</text>

  <!-- Tarjetas de Bytes en el Inspector -->
  <g transform="translate(62, 572)">
    <!-- Byte 0 -->
    <rect x="0" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#f43f5e" stroke-width="1.5" />
    <text x="12" y="22" fill="#64748b" font-size="10" class="mono">#0</text>
    <text x="114" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F635</text>
    <text x="14" y="66" font-size="30">😵</text>
    <text x="114" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x55</text>
    <text x="114" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">'U'</text>
    <line x1="12" y1="92" x2="114" y2="92" stroke="#1e293b" />
    <text x="12" y="112" fill="#94a3b8" font-size="11" class="mono">01010101</text>
    <text x="114" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">85</text>

    <!-- Byte 1 -->
    <rect x="138" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="150" y="22" fill="#64748b" font-size="10" class="mono">#1</text>
    <text x="252" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F91E</text>
    <text x="152" y="66" font-size="30">🤞</text>
    <text x="252" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x6E</text>
    <text x="252" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">'n'</text>
    <line x1="150" y1="92" x2="252" y2="92" stroke="#1e293b" />
    <text x="150" y="112" fill="#94a3b8" font-size="11" class="mono">01101110</text>
    <text x="252" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">110</text>

    <!-- Byte 2 -->
    <rect x="276" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="288" y="22" fill="#64748b" font-size="10" class="mono">#2</text>
    <text x="390" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F620</text>
    <text x="290" y="66" font-size="30">😠</text>
    <text x="390" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x20</text>
    <text x="390" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">SPC</text>
    <line x1="288" y1="92" x2="390" y2="92" stroke="#1e293b" />
    <text x="288" y="112" fill="#94a3b8" font-size="11" class="mono">00100000</text>
    <text x="390" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">32</text>

    <!-- Byte 3 -->
    <rect x="414" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="426" y="22" fill="#64748b" font-size="10" class="mono">#3</text>
    <text x="528" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F646</text>
    <text x="428" y="66" font-size="30">🙆</text>
    <text x="528" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x46</text>
    <text x="528" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">'F'</text>
    <line x1="426" y1="92" x2="528" y2="92" stroke="#1e293b" />
    <text x="426" y="112" fill="#94a3b8" font-size="11" class="mono">01000110</text>
    <text x="528" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">70</text>

    <!-- Byte 4 -->
    <rect x="552" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="564" y="22" fill="#64748b" font-size="10" class="mono">#4</text>
    <text x="666" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F911</text>
    <text x="566" y="66" font-size="30">🤑</text>
    <text x="666" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x61</text>
    <text x="666" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">'a'</text>
    <line x1="564" y1="92" x2="666" y2="92" stroke="#1e293b" />
    <text x="564" y="112" fill="#94a3b8" font-size="11" class="mono">01100001</text>
    <text x="666" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">97</text>

    <!-- Byte 5 -->
    <rect x="690" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="702" y="22" fill="#64748b" font-size="10" class="mono">#5</text>
    <text x="804" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F91E</text>
    <text x="704" y="66" font-size="30">🤞</text>
    <text x="804" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x6E</text>
    <text x="804" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">'n'</text>
    <line x1="702" y1="92" x2="804" y2="92" stroke="#1e293b" />
    <text x="702" y="112" fill="#94a3b8" font-size="11" class="mono">01101110</text>
    <text x="804" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">110</text>

    <!-- Byte 6 -->
    <rect x="828" y="0" width="126" height="130" rx="8" fill="#020617" stroke="#1e293b" />
    <text x="840" y="22" fill="#64748b" font-size="10" class="mono">#6</text>
    <text x="942" y="22" text-anchor="end" fill="#64748b" font-size="10" class="mono">U+1F924</text>
    <text x="842" y="66" font-size="30">🤤</text>
    <text x="942" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x74</text>
    <text x="942" y="72" text-anchor="end" fill="#f43f5e" font-size="12" font-weight="600" class="mono">'t'</text>
    <line x1="840" y1="92" x2="942" y2="92" stroke="#1e293b" />
    <text x="840" y="112" fill="#94a3b8" font-size="11" class="mono">01110100</text>
    <text x="942" y="112" text-anchor="end" fill="#64748b" font-size="11" class="mono">116</text>

    <!-- Byte Checksum CRC-8 -->
    <rect x="966" y="0" width="110" height="130" rx="8" fill="#022c22" stroke="#10b981" />
    <text x="978" y="22" fill="#6ee7b7" font-size="10" class="mono">#48</text>
    <text x="1064" y="22" text-anchor="end" fill="#6ee7b7" font-size="10" class="mono">CRC-8</text>
    <text x="978" y="66" font-size="30">🛡️</text>
    <text x="1064" y="54" text-anchor="end" fill="#ffffff" font-size="14" font-weight="700" class="mono">0x9C</text>
    <text x="1064" y="72" text-anchor="end" fill="#34d399" font-size="11" font-weight="700" class="mono">CHECK</text>
    <line x1="978" y1="92" x2="1064" y2="92" stroke="#065f46" />
    <text x="978" y="112" fill="#a7f3d0" font-size="11" class="mono">10011100</text>
  </g>
</svg>
